name: Sync GitHub stars

on:
  schedule:
    - cron: '43 0 * * *' # daily, 07:43 WIB; off the busy top-of-hour slots
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch stars
        run: npm run fetch:stars
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test and build (build re-runs the parser)
        run: |
          npm test
          npm run build

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data-raw/github-stars.json src/data/stars.json; then
            echo "No changes."
            exit 0
          fi
          # Authored as the account owner: Vercel Hobby skips deploys for other commit authors on private repos.
          git config user.name "zharmedia386"
          git config user.email "80077273+zharmedia386@users.noreply.github.com"
          git add data-raw/github-stars.json src/data/stars.json
          git commit -m "chore: sync GitHub stars"
          git push
